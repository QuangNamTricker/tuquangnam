<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>No Ad Youtube Premium - Từ Quang Nam</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }
    iframe {
      border: none;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

    document.onkeydown = function(e) {
      if (e.ctrlKey && e.key === 'u') return false;
      if (e.key === "F12") return false;
    }
  </script>
  
</body>
</html>
