<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>No Ad Youtube Premium - Từ Quang Nam</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      user-select: none;
    }
    iframe {
      border: none;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body oncontextmenu="return false;">
  <iframe src="https://no-ad-youtube-premium.pages.dev/" allowfullscreen></iframe>
  
  <script>
   
    document.onkeydown = function(e) {
      if (e.ctrlKey && (e.key === "u" || e.key === "U")) return false; 
      if (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "i")) return false;
      if (e.ctrlKey && e.shiftKey && (e.key === "J" || e.key === "j")) return false;
      if (e.ctrlKey && (e.key === "S" || e.key === "s")) return false;
      if (e.key === "F12") return false;
    };

   
    document.onmousedown = function(e) {
      if (e.button === 0 || e.button === 2) return false;
    };

   

    document.onkeydown = function(e) {
      if (e.ctrlKey && e.shiftKey && e.key === 'u') return false;
      if (e.ctrlKey && e.key === 'i') return false;
      if (e.key === "F12") return false;
    }
  
  </script>
</body>
</html>
