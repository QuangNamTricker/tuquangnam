<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tools - Từ Quang Nam</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        /* =============================================
           RESET & ROOT
           ============================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #00f0ff;
            --secondary: #ff007f;
            --accent: #7928ca;
            --gold: #ffd700;
            --dark-bg: #080811;
            --dark-card: #0d0f18;
            --glass-bg: rgba(13, 15, 24, 0.85);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.65);
            --shadow-neon: 0 0 40px rgba(0, 240, 255, 0.08);
            --font-display: 'Orbitron', monospace;
            --font-body: 'Poppins', sans-serif;
        }

        body {
            background: var(--dark-bg);
            color: var(--text-primary);
            font-family: var(--font-body);
            min-height: 100vh;
            padding: 20px;
            background-image: 
                radial-gradient(ellipse at 10% 20%, rgba(0, 240, 255, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(255, 0, 127, 0.03) 0%, transparent 50%);
        }

        /* =============================================
           HEADER
           ============================================= */
        .header {
            text-align: center;
            padding: 30px 20px 20px;
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            max-width: 400px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), var(--secondary), transparent);
        }

        .header-badge {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #0a0a1a;
            font-family: var(--font-display);
            font-size: 0.65rem;
            font-weight: 700;
            padding: 6px 20px;
            border-radius: 50px;
            letter-spacing: 3px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .header h1 {
            font-family: var(--font-display);
            font-size: clamp(1.6rem, 5vw, 3rem);
            font-weight: 800;
            background: linear-gradient(135deg, #fff 20%, var(--primary), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: clamp(0.85rem, 1.5vw, 1.1rem);
            margin-top: 8px;
            letter-spacing: 1px;
        }

        .header .sub-info {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 14px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .header .sub-info span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header .sub-info i {
            color: var(--primary);
        }

        /* =============================================
           SEARCH
           ============================================= */
        .search-section {
            max-width: 1100px;
            margin: 24px auto 28px;
        }

        .search-box {
            max-width: 500px;
            margin: 0 auto;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 14px 20px 14px 50px;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            color: var(--text-primary);
            font-family: var(--font-body);
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.06);
        }

        .search-box input::placeholder {
            color: var(--text-secondary);
        }

        .search-box i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }

        /* =============================================
           TOOLS GRID
           ============================================= */
        .tools-grid {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
            padding: 10px 0 40px;
        }

        /* =============================================
           TOOL CARD
           ============================================= */
        .tool-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(1.2);
            -webkit-backdrop-filter: blur(20px) saturate(1.2);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 28px 24px 24px;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            text-decoration: none;
            color: var(--text-primary);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .tool-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 100% 0%, rgba(0, 240, 255, 0.04), transparent 70%);
            pointer-events: none;
        }

        .tool-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: rgba(0, 240, 255, 0.15);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), var(--shadow-neon);
        }

        .tool-card .icon-wrap {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 14px;
            flex-shrink: 0;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .tool-card:hover .icon-wrap {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.08);
        }

        .tool-card .tool-name {
            font-family: var(--font-display);
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            color: var(--text-primary);
        }

        .tool-card .tool-short-desc {
            font-size: 0.82rem;
            color: var(--text-secondary);
            line-height: 1.6;
            flex: 1;
            margin: 6px 0 12px;
        }

        .tool-card .tool-category {
            display: inline-block;
            font-size: 0.6rem;
            padding: 3px 14px;
            border-radius: 50px;
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid rgba(0, 240, 255, 0.06);
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            align-self: flex-start;
        }

        .tool-card .tool-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        .tool-card .tool-version {
            font-size: 0.65rem;
            color: var(--text-secondary);
            font-family: var(--font-display);
        }

        .tool-card .btn-use {
            padding: 8px 22px;
            border-radius: 50px;
            border: none;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #0a0a1a;
            font-family: var(--font-body);
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .tool-card .btn-use:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.25);
        }

        .tool-card .status-badge {
            position: absolute;
            top: 14px;
            right: 14px;
            font-size: 0.55rem;
            padding: 3px 12px;
            border-radius: 50px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-badge.online {
            background: rgba(0, 255, 136, 0.12);
            color: #00ff88;
            border: 1px solid rgba(0, 255, 136, 0.1);
        }

        .status-badge.maintenance {
            background: rgba(255, 215, 0, 0.12);
            color: var(--gold);
            border: 1px solid rgba(255, 215, 0, 0.1);
        }

        .status-badge.offline {
            background: rgba(255, 0, 127, 0.12);
            color: var(--secondary);
            border: 1px solid rgba(255, 0, 127, 0.1);
        }

        /* =============================================
           EMPTY STATE
           ============================================= */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
            grid-column: 1 / -1;
        }

        .empty-state i {
            font-size: 4rem;
            color: var(--primary);
            opacity: 0.2;
            margin-bottom: 16px;
        }
        .empty-state h3 {
            font-family: var(--font-display);
            font-size: 1.2rem;
            color: var(--text-primary);
        }
        .empty-state p {
            font-size: 0.9rem;
        }

        /* =============================================
           TOAST
           ============================================= */
        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(30px);
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            padding: 12px 30px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            font-size: 0.85rem;
            color: var(--text-primary);
            box-shadow: var(--shadow-neon);
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 999999;
            pointer-events: none;
            font-family: var(--font-body);
            text-align: center;
        }
        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* =============================================
           RESPONSIVE
           ============================================= */
        @media (max-width: 640px) {
            body {
                padding: 12px;
            }
            .tools-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            .tool-card {
                padding: 20px 16px 18px;
            }
            .header h1 {
                font-size: 1.4rem;
            }
            .header .sub-info {
                font-size: 0.7rem;
                gap: 12px;
            }
        }

        @media (max-width: 400px) {
            .tool-card .tool-footer {
                flex-direction: column;
                gap: 10px;
                align-items: stretch;
            }
            .tool-card .btn-use {
                justify-content: center;
            }
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
    </style>
</head>
<body>

    <!-- ============================================
    HEADER
    ============================================ -->
    <header class="header">
        <div class="header-badge">
            <i class="fas fa-tools"></i> TOOLS &amp; UTILITIES
        </div>
        <h1>⚡ Kho Công Cụ</h1>
        <p>Tổng hợp các công cụ hỗ trợ Facebook, Automation &amp; Hacking Tool của <strong>Từ Quang Nam</strong></p>
        <div class="sub-info">
            <span><i class="fas fa-cubes"></i> <span id="totalTools">0</span> công cụ</span>
            <span><i class="fas fa-check-circle"></i> <span id="onlineTools">0</span> đang hoạt động</span>
            <span><i class="fas fa-clock"></i> Cập nhật liên tục</span>
        </div>
    </header>

    <!-- ============================================
    SEARCH
    ============================================ -->
    <section class="search-section">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Tìm kiếm công cụ theo tên hoặc mô tả...">
        </div>
    </section>

    <!-- ============================================
    TOOLS GRID
    ============================================ -->
    <section class="tools-grid" id="toolsGrid">
        <!-- Render by JavaScript -->
    </section>

    <!-- ============================================
    TOAST
    ============================================ -->
    <div id="toast">✅ Đã sao chép!</div>

    <!-- ============================================
    SCRIPTS
    ============================================ -->
    <script>
        // ================================================================
        //  DATA
        // ================================================================
        const TOOLS_DATA = {
            "tools": [{
                "id": "get_token_facebook",
                "name": "Get Token Facebook",
                "icon": "fa-brands fa-facebook",
                "color": "#1877f2",
                "description": "Lấy access token Facebook để sử dụng cho các công cụ tự động hóa, quản lý fanpage, group.",
                "short_desc": "Lấy token Facebook nhanh chóng",
                "category": "Facebook",
                "status": "online",
                "version": "2.1.0",
                "features": [
                    "Lấy token dài hạn (60 ngày)",
                    "Hỗ trợ token fanpage, group",
                    "Kiểm tra quyền truy cập"
                ],
                "requirements": [
                    "Tài khoản Facebook",
                    "Kết nối Internet"
                ]
            }, 
            
            {
      "id": "get_thongtin_fb",
      "name": "Lấy Thông Tin Facebook",
      "icon": "fa-brands fa-facebook",
      "color": "#1877f2",
      "description": "Lấy thông tin người dùng Facebook theo token, hỗ trợ lấy thông tin profile.",
      "short_desc": "Lấy thông tin Facebook nhanh chóng",
      "category": "Facebook",
      "status": "online",
      "version": "1.0.0",
      "features": [
        "Lấy thông tin profile",
        "Lấy thông tin bạn bè"
      ],
      "requirements": [
        "Token Facebook EAAAAU hợp lệ"
      ]
    }



]};

        // ================================================================
        //  GLOBAL STATE
        // ================================================================
        let currentSearch = '';

        // ================================================================
        //  RENDER TOOLS
        // ================================================================
        function renderTools() {
            const grid = document.getElementById('toolsGrid');
            const filtered = getFilteredTools();

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-search"></i>
                        <h3>Không tìm thấy công cụ nào</h3>
                        <p>Thử thay đổi từ khóa tìm kiếm nhé!</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(tool => `
                <a href="/tool/${tool.id}/" class="tool-card" data-id="${tool.id}">
                    <span class="status-badge ${tool.status}">
                        ${tool.status === 'online' ? '🟢 Hoạt động' : 
                          tool.status === 'maintenance' ? '🟡 Bảo trì' : 
                          '🔴 Tạm dừng'}
                    </span>
                    <div class="icon-wrap" style="color: ${tool.color}; border-color: ${tool.color}33;">
                        <i class="${tool.icon}"></i>
                    </div>
                    <h3 class="tool-name">${tool.name}</h3>
                    <p class="tool-short-desc">${tool.short_desc}</p>
                    <span class="tool-category">${tool.category}</span>
                    <div class="tool-footer">
                        <span class="tool-version">v${tool.version}</span>
                        <span class="btn-use">
                            <i class="fas fa-arrow-right"></i> Sử dụng
                        </span>
                    </div>
                </a>
            `).join('');

            // Update stats
            document.getElementById('totalTools').textContent = TOOLS_DATA.tools.length;
            document.getElementById('onlineTools').textContent = 
                TOOLS_DATA.tools.filter(t => t.status === 'online').length;
        }

        // ================================================================
        //  FILTER / SEARCH LOGIC
        // ================================================================
        function getFilteredTools() {
            const search = currentSearch.toLowerCase().trim();
            if (!search) return TOOLS_DATA.tools;
            
            return TOOLS_DATA.tools.filter(tool => {
                return tool.name.toLowerCase().includes(search) ||
                       tool.short_desc.toLowerCase().includes(search) ||
                       tool.description.toLowerCase().includes(search) ||
                       tool.category.toLowerCase().includes(search) ||
                       tool.features.some(f => f.toLowerCase().includes(search));
            });
        }

        // ================================================================
        //  SEARCH
        // ================================================================
        document.getElementById('searchInput').addEventListener('input', (e) => {
            currentSearch = e.target.value;
            renderTools();
        });

        // ================================================================
        //  TOAST
        // ================================================================
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._hide);
            t._hide = setTimeout(() => t.classList.remove('show'), 3000);
        }

        // ================================================================
        //  KEYBOARD SHORTCUT: ESC to clear search
        // ================================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const input = document.getElementById('searchInput');
                if (input.value) {
                    input.value = '';
                    currentSearch = '';
                    renderTools();
                }
            }
        });

        // ================================================================
        //  INIT
        // ================================================================
        document.addEventListener('DOMContentLoaded', () => {
            renderTools();
        });

        // ================================================================
        //  CONSOLE
        // ================================================================
        console.log('🚀 Tools & Utilities - Từ Quang Nam');
        console.log(`📦 ${TOOLS_DATA.tools.length} tools loaded`);
        console.log('💡 Nhấn ESC để xóa tìm kiếm');
    </script>

</body>
</html>
